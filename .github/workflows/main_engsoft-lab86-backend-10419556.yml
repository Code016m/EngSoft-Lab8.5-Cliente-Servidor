
# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure:
# https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service:
# https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - engsoft-lab86-backend-10419556

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 🛠️ Local Build Section
      # The backend is located inside the backend/ directory.
      # Therefore, dependencies must be installed from that directory.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backend

      # 📦 Upload only the backend files.
      # The frontend is deployed separately in this architecture.
      # The backend/ directory becomes the root of the deployment package.
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      # Download the backend artifact generated in the build job.
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # Authenticate with Azure using the credentials stored in GitHub Secrets.
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2D74902CB5584F29A6392F51A0F07920 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2FC8DDE475964A9CB4DE0516446512E4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5ECA940A0D4A4B3AA1249429ACCDBE86 }}

      # 🚀 Deploy the backend to Azure App Service.
      # The package contains the contents of backend/, not the entire repository.
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'engsoft-lab86-backend-10419556'
          slot-name: 'Production'
          package: .
